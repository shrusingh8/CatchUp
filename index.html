<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatchUp — what did they just say?</title>
<style>
  :root {
    --bg: #fbf7f2; --card: #fff; --ink: #1d1a17; --muted: #7a716a;
    --accent: #ff6b4a; --accent-soft: #ffe7e0; --bubble: #ece7e1; --line: #e8e1d9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151311; --card: #201d1a; --ink: #f5efe9; --muted: #a39890;
            --accent-soft: #3a2420; --bubble: #2b2724; --line: #332e2a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 44px; font-weight: 850; letter-spacing: -1.5px; margin: 0; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 19px; margin: 6px 0 32px; }
  label.small { display: block; font-size: 13px; font-weight: 600; color: var(--muted);
                text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 96px; resize: vertical; border: none; outline: none;
             background: var(--bubble); color: var(--ink); font: inherit;
             padding: 14px 18px; border-radius: 22px 22px 22px 6px; }
  textarea:focus { box-shadow: 0 0 0 3px var(--accent-soft); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; }
  .examples button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
                     font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .examples button:hover { border-color: var(--accent); }
  .go { width: 100%; border: none; background: var(--accent); color: #fff; font: inherit; font-weight: 700;
        font-size: 18px; padding: 14px; border-radius: 999px; cursor: pointer; transition: transform .1s; }
  .go:active { transform: scale(.98); }
  .go:disabled { opacity: .6; cursor: wait; }
  .result { margin-top: 24px; background: var(--card); border: 1px solid var(--line);
            border-radius: 24px; padding: 22px; display: none; }
  .result.show { display: block; animation: pop .25s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .meaning { font-size: 21px; font-weight: 650; line-height: 1.35; margin: 0; }
  .terms { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  .terms li { display: flex; gap: 10px; align-items: baseline; }
  .terms b { background: var(--accent-soft); color: var(--accent); padding: 2px 10px;
             border-radius: 999px; font-size: 15px; white-space: nowrap; }
  .terms span { color: var(--muted); font-size: 15px; }
  .error { color: var(--accent); }
  details { margin-top: 40px; color: var(--muted); font-size: 14px; }
  summary { cursor: pointer; }
  details input { width: 100%; margin-top: 10px; padding: 10px 14px; border-radius: 12px;
                  border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Catch<span>Up</span></h1>
  <p class="tag">Got a text you can't decode? Paste it in. Get what they actually meant.</p>

  <label class="small" for="msg">Their message</label>
  <textarea id="msg" placeholder="e.g. ngl that fit is bussin fr fr 💀"></textarea>

  <div class="examples" aria-label="Try an example">
    <button>no cap that's lowkey the goat 🐐</button>
    <button>it's giving main character energy</button>
    <button>wyd rn? hmu if ur down 👀</button>
  </div>

  <button class="go" id="go">Catch me up</button>

  <section class="result" id="result" aria-live="polite">
    <p class="meaning" id="meaning"></p>
    <ul class="terms" id="terms"></ul>
  </section>

  <details id="settings">
    <summary>Settings · API key</summary>
    <!-- ponytail: key lives in this browser only. A public site should call a small proxy instead so visitors don't need their own key. -->
    <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off">
    <p>Stored only in this browser. Get one at console.anthropic.com.</p>
  </details>

  <footer>Also lives in iMessage — copy a message, open CatchUp from the app drawer.</footer>
</main>

<script>
// Same prompt + schema as the iMessage version (MessagesViewController.swift) — keep them in sync.
const PROMPT = "You decode texting slang, abbreviations and emoji into plain English for someone who isn't fluent in it. 'meaning' = what the sender is actually saying, in one or two casual sentences. 'terms' = each slang word, abbreviation or emoji used and what it means here (empty if none).";
const SCHEMA = {
  type: "object",
  properties: {
    meaning: { type: "string" },
    terms: { type: "array", items: {
      type: "object",
      properties: { term: { type: "string" }, means: { type: "string" } },
      required: ["term", "means"], additionalProperties: false } },
  },
  required: ["meaning", "terms"], additionalProperties: false,
};

const $ = id => document.getElementById(id);
const key = $("key");
key.value = localStorage.getItem("catchup-key") || "";
key.oninput = () => localStorage.setItem("catchup-key", key.value.trim());

document.querySelectorAll(".examples button").forEach(b =>
  b.onclick = () => { $("msg").value = b.textContent; go(); });
$("go").onclick = go;
$("msg").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go(); };

function show(meaning, terms = [], isError = false) {
  $("meaning").textContent = meaning;
  $("meaning").classList.toggle("error", isError);
  $("terms").replaceChildren(...terms.map(t => {
    const li = document.createElement("li");
    li.innerHTML = "<b></b><span></span>";
    li.querySelector("b").textContent = t.term;      // textContent, never innerHTML, for model output
    li.querySelector("span").textContent = t.means;
    return li;
  }));
  $("result").classList.remove("show"); void $("result").offsetWidth; $("result").classList.add("show");
}

async function go() {
  const text = $("msg").value.trim();
  if (!text) return $("msg").focus();
  if (!key.value.trim()) { $("settings").open = true; key.focus(); return show("Add your API key in Settings below first.", [], true); }

  $("go").disabled = true; $("go").textContent = "Decoding…";
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": key.value.trim(),
        "anthropic-version": "2023-06-01",
        "anthropic-beta": "server-side-fallback-2026-07-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json",
      },
      body: JSON.stringify({
        model: "claude-opus-5-5",
        max_tokens: 1024,
        fallbacks: "default",
        system: PROMPT,
        messages: [{ role: "user", content: text }],
        output_config: { effort: "low", format: { type: "json_schema", schema: SCHEMA } },
      }),
    });
    const data = await res.json();
    if (data.error) return show("Something went wrong: " + data.error.message, [], true);
    if (data.stop_reason === "refusal") return show("CatchUp can't translate that one.", [], true);
    const out = JSON.parse(data.content.find(b => b.type === "text").text);
    show(out.meaning, out.terms);
  } catch {
    show("Couldn't connect. Check your internet and try again.", [], true);
  } finally {
    $("go").disabled = false; $("go").textContent = "Catch me up";
  }
}
</script>
</body>
</html>
