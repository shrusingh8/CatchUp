<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CatchUp — what did they just say?</title>
<link rel="icon" href="logo.svg">
<style>
  :root {
    --page: #e9e6e2; --screen: #fff; --ink: #111; --muted: #8e8e93; --line: #e5e5ea;
    --sent: #0a84ff; --recv: #e9e9eb; --accent: #ff6b4a; --chip: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #0d0d0e; --screen: #000; --ink: #fff; --line: #2c2c2e; --recv: #26252a; --chip: #1c1c1e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); display: grid; place-items: center;
         font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }

  /* phone frame on desktop, full screen on phones */
  .phone { width: 390px; height: min(820px, 96vh); background: var(--screen); border-radius: 48px;
           box-shadow: 0 0 0 10px #1b1b1d, 0 30px 80px rgba(0,0,0,.35);
           display: flex; flex-direction: column; overflow: hidden; }
  @media (max-width: 500px) { .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; } }

  header { padding: 18px 16px 10px; text-align: center; border-bottom: 1px solid var(--line);
           background: color-mix(in srgb, var(--screen) 85%, transparent); backdrop-filter: blur(20px); }
  header img { width: 56px; height: 56px; display: block; margin: 0 auto 4px; }
  header .name { font-size: 12px; font-weight: 500; }
  header .name::after { content: " ›"; color: var(--muted); }

  #chat { flex: 1; overflow-y: auto; padding: 12px 12px 4px; display: flex; flex-direction: column; gap: 3px; }
  .stamp { text-align: center; color: var(--muted); font-size: 11px; margin: 6px 0 10px; }
  .msg { max-width: 76%; padding: 8px 13px; border-radius: 19px; white-space: pre-wrap; word-wrap: break-word;
         animation: in .22s ease-out; }
  .msg.me { align-self: flex-end; background: var(--sent); color: #fff; border-bottom-right-radius: 6px; }
  .msg.them { align-self: flex-start; background: var(--recv); border-bottom-left-radius: 6px; }
  .msg + .msg.me, .msg + .msg.them { margin-top: 2px; }
  .msg.me + .msg.them, .msg.them + .msg.me { margin-top: 10px; }
  .msg.error { color: var(--accent); }
  .terms { display: grid; gap: 6px; }
  .terms div { font-size: 15px; }
  .terms b { color: var(--accent); }
  .delivered { align-self: flex-end; color: var(--muted); font-size: 11px; margin: 2px 4px 0; }
  .typing { display: flex; gap: 4px; padding: 12px 14px; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.97); } }

  .quick { display: flex; gap: 6px; overflow-x: auto; padding: 6px 12px; scrollbar-width: none; }
  .quick button { flex: none; border: 1px solid var(--line); background: var(--chip); color: var(--sent);
                  font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }

  form { display: flex; align-items: flex-end; gap: 8px; padding: 6px 12px max(14px, env(safe-area-inset-bottom)); }
  textarea { flex: 1; resize: none; max-height: 120px; overflow-y: auto; scrollbar-width: none; border: 1px solid var(--line); border-radius: 20px;
             padding: 8px 14px; font: inherit; color: var(--ink); background: var(--screen); outline: none; }
  form button { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--sent); color: #fff;
                font-size: 19px; font-weight: 700; cursor: pointer; flex: none; margin-bottom: 1px; }
  form button:disabled { background: var(--line); cursor: default; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <img src="logo.svg" alt="CatchUp logo">
    <div class="name">CatchUp</div>
  </header>

  <div id="chat" aria-live="polite">
    <div class="stamp">Today</div>
  </div>

  <div class="quick" aria-label="Try an example">
    <button>no cap that's lowkey the goat 🐐</button>
    <button>it's giving main character energy</button>
    <button>wyd rn? hmu if ur down 👀</button>
  </div>

  <form id="form">
    <textarea id="msg" rows="1" placeholder="Paste a text you can't decode" aria-label="Message"></textarea>
    <button id="send" aria-label="Send" disabled>↑</button>
  </form>
</div>

<script>
// Same prompt + schema as the iMessage version (MessagesViewController.swift) — keep them in sync.
const PROMPT = "You decode texting slang, abbreviations and emoji into plain English for someone who isn't fluent in it. 'meaning' = what the sender is actually saying, in one or two casual sentences. 'terms' = each slang word, abbreviation or emoji used and what it means here (empty if none).";
const SCHEMA = {
  type: "object",
  properties: {
    meaning: { type: "string" },
    terms: { type: "array", items: {
      type: "object",
      properties: { term: { type: "string" }, means: { type: "string" } },
      required: ["term", "means"], additionalProperties: false } },
  },
  required: ["meaning", "terms"], additionalProperties: false,
};

const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("msg"), send = $("send");
// ponytail: key lives in this browser only. A public site should call a small proxy so visitors don't need a key.
let key = localStorage.getItem("catchup-key") || "";

function bubble(who, text, cls = "") {
  const el = document.createElement("div");
  el.className = `msg ${who} ${cls}`;
  if (typeof text === "string") el.textContent = text; else el.append(text);  // never innerHTML for model output
  chat.append(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function typing() {
  const el = bubble("them", "", "typing");
  el.innerHTML = "<i></i><i></i><i></i>";
  return el;
}

function termsList(terms) {
  const box = document.createElement("div");
  box.className = "terms";
  for (const t of terms) {
    const row = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = t.term;
    row.append(b, " — " + t.means);
    box.append(row);
  }
  return box;
}

// Opening message from CatchUp
bubble("them", key
  ? "hey 👋 send me any text you can't decode and I'll tell you what they actually meant"
  : "hey 👋 I decode slang. first, paste your Anthropic API key here (starts with sk-ant-). it stays in this browser.");

input.oninput = () => {
  send.disabled = !input.value.trim();
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
};
input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
document.querySelectorAll(".quick button").forEach(b =>
  b.onclick = () => { input.value = b.textContent; input.oninput(); $("form").requestSubmit(); });

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = ""; input.oninput();

  // Pasting a key just saves it — never shown in the chat.
  if (text.startsWith("sk-ant-")) {
    key = text; localStorage.setItem("catchup-key", key);
    bubble("me", "🔑 API key");
    bubble("them", "got it ✅ now send me a text you can't decode");
    return;
  }

  bubble("me", text);
  if (!key) return bubble("them", "paste your API key first (starts with sk-ant-) and I'm all yours", "error");

  document.querySelector(".delivered")?.remove();
  chat.insertAdjacentHTML("beforeend", '<div class="delivered">Delivered</div>');
  send.disabled = true;
  const dots = typing();
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-beta": "server-side-fallback-2026-07-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json",
      },
      body: JSON.stringify({
        model: "claude-opus-5-5",
        max_tokens: 1024,
        fallbacks: "default",
        system: PROMPT,
        messages: [{ role: "user", content: text }],
        output_config: { effort: "low", format: { type: "json_schema", schema: SCHEMA } },
      }),
    });
    const data = await res.json();
    dots.remove();
    if (data.error) {
      if (data.error.type === "authentication_error") { key = ""; localStorage.removeItem("catchup-key"); }
      return bubble("them", "hmm, that didn't work: " + data.error.message, "error");
    }
    if (data.stop_reason === "refusal") return bubble("them", "I can't translate that one 😬", "error");
    const out = JSON.parse(data.content.find(b => b.type === "text").text);
    bubble("them", out.meaning);
    if (out.terms.length) bubble("them", termsList(out.terms));
  } catch {
    dots.remove();
    bubble("them", "couldn't connect 📵 check your internet and try again", "error");
  }
};
</script>
</body>
</html>
